    <script>
(function () {
  if (!matchMedia('(pointer: coarse)').matches) return;

  // Long-press opens the same smart menu as right-click (iOS never fires contextmenu).
  var timer = null, startX = 0, startY = 0, startEl = null, nativeMenu = false, firedAt = 0;
  function cancel() { if (timer) { clearTimeout(timer); timer = null; } }
  document.addEventListener('contextmenu', function (e) { if (e.isTrusted) nativeMenu = true; }, true);
  document.addEventListener('touchstart', function (e) {
    cancel();
    if (e.touches.length !== 1) return;
    var el = e.target;
    if (!el.closest || el.closest('input,textarea,select,[contenteditable],.b2-viewport')) return;
    startX = e.touches[0].clientX; startY = e.touches[0].clientY; startEl = el; nativeMenu = false;
    timer = setTimeout(function () {
      timer = null;
      if (nativeMenu || !startEl.isConnected) return;
      firedAt = Date.now();
      startEl.dispatchEvent(new MouseEvent('contextmenu', { bubbles: true, cancelable: true, view: window, clientX: startX, clientY: startY }));
      if (navigator.vibrate) navigator.vibrate(10);
    }, 520);
  }, { capture: true, passive: true });
  document.addEventListener('touchmove', function (e) {
    var t = e.touches[0];
    if (timer && t && Math.hypot(t.clientX - startX, t.clientY - startY) > 10) cancel();
  }, { capture: true, passive: true });
  document.addEventListener('touchend', cancel, true);
  document.addEventListener('touchcancel', cancel, true);
  document.addEventListener('click', function (e) {
    if (Date.now() - firedAt < 600) { e.preventDefault(); e.stopImmediatePropagation(); }
  }, true);

  // Board: one-finger swipes scroll the page until the board is tapped; "Done" hands scrolling back.
  function setupBoard(vp) {
    if (vp.__ddLock) return;
    var state = vp.__ddLock = { locked: true };
    var hint = document.createElement('button');
    hint.type = 'button';
    hint.className = 'dd-board-hint';
    vp.parentElement.appendChild(hint);
    function render() {
      vp.classList.toggle('dd-board-locked', state.locked);
      hint.dataset.locked = state.locked;
      var fa = document.documentElement.lang === 'fa';
      hint.textContent = state.locked ? (fa ? 'برای کار با برد لمس کن' : 'Tap to use the board') : (fa ? 'تمام ✓' : 'Done with board ✓');
    }
    state.lock = function (on) { state.locked = on; render(); };
    hint.addEventListener('click', function (e) { e.stopPropagation(); state.lock(true); });
    if ('IntersectionObserver' in window) {
      new IntersectionObserver(function (entries) {
        if (entries[0].intersectionRatio < 0.3) state.lock(true);
      }, { threshold: [0, 0.3] }).observe(vp);
    }
    render();
  }
  function lockedBoard(target) {
    var vp = target && target.closest && target.closest('.b2-viewport');
    // full screen can't scroll the page, so the board is always live there
    return vp && vp.__ddLock && vp.__ddLock.locked && !vp.closest('.focus-mode') ? vp : null;
  }

    window.addEventListener(type, function (e) { if (lockedBoard(e.target)) e.stopImmediatePropagation(); }, { capture: true, passive: true });
  });
  window.addEventListener('click', function (e) {
    var vp = lockedBoard(e.target);
    if (!vp) return;
    e.preventDefault(); e.stopImmediatePropagation();
    vp.__ddLock.lock(false);
  }, true);
  new MutationObserver(function () {
    document.querySelectorAll('.b2-viewport').forEach(setupBoard);
  }).observe(document.documentElement, { childList: true, subtree: true });
})();
