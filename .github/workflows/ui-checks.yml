name: UI regression checks
on:
  pull_request:
  push:
    branches: [feat/animated-stickers-interactions]
concurrency:
  group: ui-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run test:browser
        env:
          DEBUG_DAY_SCREENSHOTS: test-results
          DD_QA_SCREENSHOTS: test-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-screenshots
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
